name: Bug report
description: Something in Techomato Orbit does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Services page
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbit version
      description: Settings > About shows it.
      placeholder: '0.2.0'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2, 64-bit
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here. Remove passwords, tokens and personal paths first.
