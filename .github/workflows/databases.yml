name: Databases
# Weekly check that every one-click database still downloads (same file, same SHA-256), starts,
# accepts a connection and stops. Kept out of CI: it downloads about 1 GB.
on:
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-databases:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - run: cargo test --test real_databases -- --ignored --nocapture
        working-directory: src-tauri
        env:
          ORBIT_ENGINES: redis,mariadb,postgres,mongo
