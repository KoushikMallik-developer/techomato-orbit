<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-600-normal.woff2');
        font-weight: 600;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1500px;
        height: 500px;
        overflow: hidden;
      }
      body {
        font-family: 'Instrument', sans-serif;
        position: relative;
      }
      h1,
      .mark {
        font-family: 'Bricolage', sans-serif;
        letter-spacing: -0.03em;
      }

      body {
        background: #c8381f;
        color: #f5f2ec;
        padding: 0 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        font-size: 230px;
        line-height: 0.9;
        font-weight: 800;
      }
      h1 span {
        color: #17181c;
      }
      p {
        margin-top: 22px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .s {
        font-size: 22px;
        font-weight: 400;
        opacity: 0.92;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Orbit<span>.</span></h1>
    <p>Your local dev machine in one window.</p>
    <div class="s">Techomato Orbit · free for Windows</div>
  </body>
