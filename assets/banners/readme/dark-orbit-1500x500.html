<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-600-normal.woff2');
        font-weight: 600;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1500px;
        height: 500px;
        overflow: hidden;
      }
      body {
        font-family: 'Instrument', sans-serif;
        position: relative;
      }
      h1,
      .mark {
        font-family: 'Bricolage', sans-serif;
        letter-spacing: -0.03em;
      }

      body {
        background: #141417;
        color: #f1efea;
        padding: 0 120px;
        display: flex;
        align-items: center;
      }
      .r {
        position: absolute;
        border-radius: 50%;
        border: 2px solid #2c2e35;
      }
      .r1 {
        width: 760px;
        height: 760px;
        right: -120px;
        top: -130px;
      }
      .r2 {
        width: 540px;
        height: 540px;
        right: -10px;
        top: -20px;
        border-color: #3d4048;
      }
      .r3 {
        width: 320px;
        height: 320px;
        right: 100px;
        top: 90px;
        border-color: #c63f27;
        border-width: 4px;
      }
      .d {
        position: absolute;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #c63f27;
        right: 405px;
        top: 112px;
        box-shadow: 0 0 60px 14px rgba(198, 63, 39, 0.55);
      }
      .c {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #f1efea;
        right: 212px;
        top: 202px;
      }
      .t {
        position: relative;
        max-width: 700px;
      }
      .mark {
        font-weight: 800;
        font-size: 28px;
        color: #f4896f;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 66px;
        line-height: 1.04;
        font-weight: 800;
      }
      p {
        margin-top: 24px;
        font-size: 23px;
        line-height: 1.4;
        color: #c9cbd2;
      }
    </style>
  </head>
  <body>
    <div class="r r1"></div>
    <div class="r r2"></div>
    <div class="r r3"></div>
    <div class="d"></div>
    <div class="c"></div>
    <div class="t">
      <div class="mark">Techomato Orbit</div>
      <h1>Your local dev machine in one window.</h1>
      <p>Services, databases, logs and PC health. Free for Windows.</p>
    </div>
  </body>
</html>
