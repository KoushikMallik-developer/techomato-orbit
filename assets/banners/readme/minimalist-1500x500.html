<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-600-normal.woff2');
        font-weight: 600;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1500px;
        height: 500px;
        overflow: hidden;
      }
      body {
        font-family: 'Instrument', sans-serif;
        position: relative;
      }
      h1,
      .mark {
        font-family: 'Bricolage', sans-serif;
        letter-spacing: -0.03em;
      }

      body {
        background: #f5f2ec;
        color: #17181c;
        padding: 0 120px;
        display: flex;
        align-items: center;
        gap: 80px;
      }
      .t {
        flex: 1;
      }
      .mark {
        font-weight: 800;
        font-size: 30px;
        margin-bottom: 28px;
      }
      .mark i {
        color: #c8381f;
        font-style: normal;
      }
      h1 {
        font-size: 68px;
        line-height: 1.02;
        font-weight: 800;
        max-width: 760px;
      }
      p {
        margin-top: 26px;
        font-size: 24px;
        line-height: 1.4;
        color: #45484f;
        max-width: 640px;
      }
      .i {
        width: 260px;
        height: 260px;
        flex: none;
        filter: drop-shadow(0 24px 30px rgba(23, 24, 28, 0.18));
      }
    </style>
  </head>
  <body>
    <div class="t">
      <div class="mark">Techomato Orbit<i>.</i></div>
      <h1>Your local dev machine in one window.</h1>
      <p>Start services, add databases, read logs and check your PC's health. Free for Windows.</p>
    </div>
    <div class="i">
      <svg viewBox="0 0 1024 1024">
        <rect width="1024" height="1024" rx="232" fill="#C8381F" />
        <circle cx="512" cy="512" r="266" fill="none" stroke="#F5F2EC" stroke-width="88" />
        <circle cx="512" cy="512" r="92" fill="#F5F2EC" />
        <circle cx="700" cy="324" r="70" fill="#17181C" />
      </svg>
    </div>
  </body>
</html>
