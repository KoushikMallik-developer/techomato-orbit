[package]
name = "techomato-orbit"
version = "0.1.0"
description = "Techomato Orbit — your local dev machine in one window"
authors = ["Techomato"]
license = "MIT"
default-run = "techomato-orbit"
edition = "2021"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Credentials", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Services", "Win32_UI_Shell", "Win32_System_SystemInformation"] }
sysinfo = "0.40.4"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# TLS comes from the updater plugin's reqwest, which needs a `ring` provider installed (see
# engines/install.rs, done the same way the updater does it).
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
tempfile = "3"
